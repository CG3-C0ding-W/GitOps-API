
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: myapp
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com/CG3-C0ding-W/GitOps-API
    targetRevision: main
    path: charts/myapp
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true